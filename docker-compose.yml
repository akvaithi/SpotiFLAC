name: spotiflac
services:
  spotiflac:
    image: ghcr.io/akvaithi/spotiflac:latest
    container_name: spotiflac
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /srv/media/Music:/downloads
      - ./config:/config
    environment:
      ADDR: :8080
      DOWNLOAD_DIR: /downloads
      CONFIG_DIR: /config
      DOUBLEDOUBLE_GATEWAY_URL: http://chromium:8082
      SUBSONIC_FACADE: inject
      NAVIDROME_URL: http://navidrome:4533
      NAVIDROME_USER: ${NAVIDROME_USER:?Read the Navidrome account from Keychain}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:?Read the Navidrome password from Keychain}
      API_TOKEN: ${API_TOKEN:?Read the existing SpotiFLAC API token from Keychain}
    networks:
      - chromium
      - navidrome
    restart: unless-stopped
networks:
  chromium:
    external: true
    name: chromium_default
  navidrome:
    external: true
    name: navidrome_default
