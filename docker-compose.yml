services:
  spotiflac:
    image: ghcr.io/akvaithi/spotiflac:latest
    container_name: spotiflac
    ports:
      - "8080:8080"
    volumes:
      # Left side = path on your ZimaOS host. Adjust to your shares.
      - /DATA/Media/Music:/downloads
      - /DATA/AppData/spotiflac:/config
    environment:
      - ADDR=:8080
      - DOWNLOAD_DIR=/downloads
      - CONFIG_DIR=/config
      - FLACIT_GATEWAY_URL=http://172.17.0.1:8082
    restart: unless-stopped

  # SpotiFLAC's only download source: drives @deezload2bot over Telegram to
  # fetch lossless FLAC. Needs an authenticated Telethon session at
  # /DATA/AppData/flacit-gateway/telegram-session.session — see
  # flacit-gateway/README.md for the one-time login/bootstrap.
  flacit-gateway:
    image: ghcr.io/akvaithi/flacit-gateway:latest
    container_name: flacit-gateway
    ports:
      - "8082:8082"
    volumes:
      - /DATA/AppData/flacit-gateway:/config
    restart: unless-stopped
