services:
  spotiflac:
    image: ghcr.io/akvaithi/spotiflac:latest
    container_name: spotiflac
    ports:
      - "8080:8080"
    volumes:
      # Left side = path on your ZimaOS host. Adjust to your shares.
      - /DATA/Media/Music:/downloads
      - /DATA/AppData/spotiflac:/config
    environment:
      - ADDR=:8080
      - DOWNLOAD_DIR=/downloads
      - CONFIG_DIR=/config
    restart: unless-stopped

  # Optional: your own Tidal gateway so downloads use YOUR subscription instead
  # of the shared community servers (no rate limits / Cloudflare). Remove this
  # block if you don't want it. Requires a one-time login (see SETUP.md).
  tidal-gateway:
    image: ghcr.io/akvaithi/tidal-gateway:latest
    container_name: tidal-gateway
    ports:
      - "8081:8081"
    volumes:
      - /DATA/AppData/tidal-gateway:/config
    restart: unless-stopped
