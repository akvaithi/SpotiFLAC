services:
  spotiflac:
    image: ghcr.io/akvaithi/spotiflac:latest
    # To build locally instead of pulling, comment the image line and use:
    # build: .
    container_name: spotiflac
    ports:
      - "8080:8080"
    volumes:
      # Left side = path on your ZimaOS host. Adjust to your shares.
      - /DATA/Media/Music:/downloads
      - /DATA/AppData/spotiflac:/config
    environment:
      - ADDR=:8080
      - DOWNLOAD_DIR=/downloads
      - CONFIG_DIR=/config
      # Optional: if behind a reverse proxy, set the externally-visible URL so
      # the Cloudflare verification callback resolves correctly.
      # - PUBLIC_URL=https://spotiflac.example.com
    restart: unless-stopped
