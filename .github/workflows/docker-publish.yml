name: Build and publish SpotiFLAC
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/spotiflac:latest
            ghcr.io/${{ github.repository_owner }}/spotiflac:sha-${{ github.sha }}
          cache-from: type=gha,scope=spotiflac
          cache-to: type=gha,mode=max,scope=spotiflac
